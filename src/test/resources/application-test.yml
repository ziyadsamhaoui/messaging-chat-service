spring:
  data:
    mongodb:
      uri: mongodb://localhost:27017/messaging_chat_test
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://messaging-auth-service:8081/oauth2/jwks

badrlink:
  kafka:
    enabled: false
  chat:
    ensure-indexes: false
    internal-service-token: test-internal-token
  user-service:
    base-url: http://localhost:8082
    internal-token: test-internal-token

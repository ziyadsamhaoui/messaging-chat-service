server:
  port: ${CHAT_SERVICE_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: messaging-chat-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:secret@localhost:27017/messaging_chat?authSource=admin&replicaSet=rs0}
      auto-index-creation: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/.well-known/jwks.json}
  lifecycle:
    timeout-per-shutdown-phase: 20s

badrlink:
  chat:
    default-page-size: 30
    max-page-size: 100
    max-group-size: 100
    max-message-length: 4000
    default-invitation-ttl: 72h
    max-invitation-ttl: 30d
    ensure-indexes: true
    internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8082}
    profile-path: /internal/users/{userId}
    block-status-path: /internal/users/block-status
    internal-token-header: X-BadrLink-Internal-Token
    internal-token: ${USER_SERVICE_INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 3s

logging:
  level:
    com.ziyadsamhaoui.messagingchatservice: INFO

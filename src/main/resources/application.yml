server:
  port: ${CHAT_SERVICE_PORT:8083}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,mongo
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  application:
    name: messaging-chat-service
  config:
    import: "optional:file:.env[.properties]"
  data:
    mongodb:
      auto-index-creation: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  lifecycle:
    timeout-per-shutdown-phase: 20s
  mongodb:
    uri: ${MONGODB_URI}

badrlink:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    outbox:
      enabled: ${KAFKA_ENABLED:true}
      batch-size: ${KAFKA_RELAY_BATCH:100}
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  chat:
    default-page-size: 30
    max-page-size: 100
    max-group-size: 100
    max-message-length: 4000
    default-invitation-ttl: 72h
    max-invitation-ttl: 30d
    ensure-indexes: true
    internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN}
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8082}
    profile-path: /internal/users/{userId}
    block-status-path: /internal/blocks/check
    internal-token-header: X-Internal-Token
    internal-token: ${USER_SERVICE_INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 3s
  observability:
    outbox:
      refresh-interval: ${OUTBOX_METRICS_INTERVAL:15s}
    kafka-lag:
      refresh-interval: ${KAFKA_LAG_METRICS_INTERVAL:15s}
      group-id: messaging-chat-service

logging:
  level:
    com.ziyadsamhaoui.messagingchatservice: INFO
  structured:
    format:
      console: logstash
    json:
      context:
        include: true
        prefix: ""

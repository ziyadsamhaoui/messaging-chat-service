server:
  port: ${CHAT_SERVICE_PORT:8083}
  shutdown: graceful

spring:
  application:
    name: messaging-chat-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://root:secret@localhost:27017/messaging_chat?authSource=admin&replicaSet=rs0}
      auto-index-creation: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_JWK_SET_URI:http://messaging-auth-service:8081/oauth2/jwks}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  lifecycle:
    timeout-per-shutdown-phase: 20s

badrlink:
  kafka:
    enabled: ${KAFKA_ENABLED:true}
    outbox:
      enabled: ${KAFKA_ENABLED:true}
      batch-size: ${KAFKA_RELAY_BATCH:100}
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  chat:
    default-page-size: 30
    max-page-size: 100
    max-group-size: 100
    max-message-length: 4000
    default-invitation-ttl: 72h
    max-invitation-ttl: 30d
    ensure-indexes: true
    internal-service-token: ${CHAT_INTERNAL_SERVICE_TOKEN}
  user-service:
    # Contract below must match messaging-user-service's actual endpoints
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8082}
    profile-path: /internal/users/{userId}
    block-status-path: /internal/blocks/check
    internal-token-header: X-Internal-Token
    internal-token: ${USER_SERVICE_INTERNAL_TOKEN}
    connect-timeout: 2s
    read-timeout: 3s

logging:
  level:
    com.ziyadsamhaoui.messagingchatservice: INFO

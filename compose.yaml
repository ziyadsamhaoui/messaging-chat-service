services:
  mongodb:
    image: 'mongo:8'
    command: ['--replSet', 'rs0', '--bind_ip_all']
    environment:
      - 'MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}'
      - 'MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}'
      - 'MONGO_INITDB_DATABASE=${MONGO_DATABASE}'
    ports:
      - '27017:27017'
    volumes:
      - 'mongodb-data:/data/db'
    healthcheck:
      test:
        - 'CMD-SHELL'
        - "mongosh --quiet --host localhost:27017 --username root --password secret --authenticationDatabase admin --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongodb-init:
    image: 'mongo:8'
    depends_on:
      mongodb:
        condition: service_healthy
    restart: 'on-failure'
    entrypoint:
      - 'bash'
      - '-c'
      - "mongosh --quiet --host mongodb:27017 --username root --password secret --authenticationDatabase admin --eval 'try { rs.status() } catch (error) { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"localhost:27017\" }] }) }'"

  kafka:
    image: 'apache/kafka:4.1.1'
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  mongodb-data:
